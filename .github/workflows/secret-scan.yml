name: Gizli bilgi taramasi (TruffleHog)
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # her pazartesi 08:00 (TR)
  workflow_dispatch:
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
